<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serpiente de la Selva</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/engine.js"></script>
<script>
'use strict';
const CW = 24, CH = 16, C = 32, W = CW * C, H = CH * C;
const A = '../assets/serpiente/';
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const LV = [
  { name: 'Claro del bosque', wrap: false, rocks: () => [] },
  { name: 'El tronco caído', wrap: false, rocks: () => range(6, 17).map(x => [x, 8]) },
  { name: 'Cuatro piedras', wrap: false, rocks: () => [[5, 5], [17, 5], [5, 11], [17, 11]].flatMap(([x, y]) => [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]]) },
  { name: 'Encrucijada', wrap: false, rocks: () => [...range(5, 13).map(y => [12, y]), ...range(6, 18).filter(x => x !== 12).map(x => [x, 9])] },
  { name: 'Pasillos', wrap: false, rocks: () => [...range(0, 15).map(x => [x, 5]), ...range(8, 23).map(x => [x, 11])] },
  { name: 'Las cámaras', wrap: false, rocks: () => [...range(4, 10).map(y => [8, y]), ...range(6, 15).map(y => [16, y]), ...range(0, 4).map(x => [x, 12])] },
  { name: 'Lluvia de rocas', wrap: true, rocks: () => { const r = Engine.rng(77), out = []; while (out.length < 26) { const x = (r() * CW) | 0, y = 4 + ((r() * (CH - 4)) | 0); if (!out.some(o => o[0] === x && o[1] === y)) out.push([x, y]); } return out; } },
  { name: 'Diagonales', wrap: true, rocks: () => [...range(0, 7).map(i => [4 + i, 5 + i]), ...range(0, 7).map(i => [19 - i, 5 + i])] },
  { name: 'El templo', wrap: true, rocks: () => { const o = []; for (let x = 5; x <= 18; x++) if (Math.abs(x - 11.5) > 1.5) { o.push([x, 5], [x, 12]); } for (let y = 6; y <= 11; y++) if (Math.abs(y - 8.5) > 1) { o.push([5, y], [18, y]); } return o; } },
  { name: 'Laberinto final', wrap: true, rocks: () => [...range(4, 13).map(y => [4, y]), ...range(0, 9).map(y => [9, y]), ...range(6, 15).map(y => [14, y]), ...range(0, 9).map(y => [19, y]), ...range(5, 8).map(x => [x, 13]), ...range(15, 18).map(x => [x, 6])] }
];
const P = new Engine.Particles();
let S = null;

const G = Engine.create({
  id: 'serpiente', title: 'Serpiente de la Selva', genre: 'Arcade clásico', accent: '#7dff5a',
  tagline: 'Guía a la serpiente por la selva, devora frutas y crece sin chocar contigo misma.',
  help: ['<b>Flechas / WASD</b> o desliza para girar', 'Come las manzanas para crecer y completar el nivel', 'La <b>manzana dorada</b> da puntos extra, ¡pero desaparece pronto!', 'En niveles avanzados los bordes te teletransportan al otro lado'],
  levels: LV.length, background: A + 'bg.webp',
  assets: { c0: A + 'cell0.webp', c1: A + 'cell1.webp', head: A + 'head.webp', body: A + 'body.webp', apple: A + 'apple.webp', gold: A + 'gold.webp', rock: A + 'rock.webp' },
  onLevel: load,
  onReady(g) {
    g.canvas(W, H); g.loop(update, render);
    g.swipe(g.stage, (dx, dy) => turn(dx, dy));
  }
});

function load(n) {
  const cfg = LV[n - 1];
  const rocks = new Set(cfg.rocks().map(([x, y]) => x + ',' + y));
  for (let x = 2; x <= 9; x++) rocks.delete(x + ',2');
  const snake = [[6, 2], [5, 2], [4, 2], [3, 2]];
  S = { cfg, rocks, snake, prev: snake.map(s => s.slice()), dir: [1, 0], queue: [], grow: 0, eaten: 0, target: 8 + n * 2, score: 0,
    tick: Math.max(.075, .13 - (n - 1) * .006), acc: 0, started: false, dead: false, t: 0, golds: 0, gold: null, apple: null, nextGold: 4 };
  S.apple = freeCell();
  P.clear(); hud();
  G.toast(`${cfg.name}${cfg.wrap ? ' · bordes abiertos' : ''}`);
}
function hud() { G.hud({ Nivel: `${G.level}/${LV.length}`, Frutas: `${S.eaten}/${S.target}`, Doradas: S.golds, Puntos: S.score }); }
function freeCell() {
  for (;;) {
    const x = (Math.random() * CW) | 0, y = (Math.random() * CH) | 0;
    if (S.rocks.has(x + ',' + y) || S.snake.some(s => s[0] === x && s[1] === y)) continue;
    if (S.apple && S.apple[0] === x && S.apple[1] === y) continue;
    if (S.gold && S.gold.p[0] === x && S.gold.p[1] === y) continue;
    return [x, y];
  }
}
function turn(dx, dy) {
  if (!S || S.dead || !G.playing || G.paused) return;
  const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
  if (last[0] === -dx && last[1] === -dy) return;
  if (last[0] === dx && last[1] === dy && S.started) return;
  if (S.queue.length < 3) S.queue.push([dx, dy]);
  S.started = true;
}
addEventListener('keydown', e => {
  const m = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] }[e.code];
  if (m) turn(...m);
});
function die() {
  S.dead = true; G.sfx('explode');
  for (const [x, y] of S.snake) P.burst(x * C + 16, y * C + 16, 4, { color: ['#7dff5a', '#1a8a34', '#ffffff'], speed: 160 });
  setTimeout(() => G.lose('¡Choque!', [['Frutas', `${S.eaten}/${S.target}`], ['Puntos', S.score]]), 700);
}
function step() {
  if (S.queue.length) S.dir = S.queue.shift();
  S.prev = S.snake.map(s => s.slice());
  const h = S.snake[0];
  let nx = h[0] + S.dir[0], ny = h[1] + S.dir[1];
  if (S.cfg.wrap) { nx = (nx + CW) % CW; ny = (ny + CH) % CH; }
  else if (nx < 0 || ny < 0 || nx >= CW || ny >= CH) return die();
  if (S.rocks.has(nx + ',' + ny)) return die();
  const tailMoves = S.grow === 0;
  for (let i = 0; i < S.snake.length - (tailMoves ? 1 : 0); i++) if (S.snake[i][0] === nx && S.snake[i][1] === ny) return die();
  S.snake.unshift([nx, ny]);
  if (S.grow > 0) S.grow--; else S.snake.pop();
  if (nx === S.apple[0] && ny === S.apple[1]) {
    S.eaten++; S.grow += 1; S.score += 10; G.sfx('pop');
    P.burst(nx * C + 16, ny * C + 16, 14, { color: ['#ff6b6b', '#ffffff', '#3fbf4a'], speed: 180, life: .5 });
    if (S.eaten >= S.target) {
      S.dead = true;
      const par = S.target * (11 * S.tick + .9);
      const stars = S.t <= par ? 3 : S.t <= par * 1.5 ? 2 : 1;
      S.score += Math.max(0, Math.round((par * 1.5 - S.t) * 10));
      setTimeout(() => G.win(stars, [['Tiempo', S.t.toFixed(1) + ' s'], ['Objetivo ★★★', par.toFixed(0) + ' s'], ['Doradas', S.golds], ['Puntos', S.score]], S.score), 400);
    } else {
      S.apple = freeCell();
      if (S.eaten >= S.nextGold) { S.nextGold += 4; S.gold = { p: freeCell(), t: 7 }; G.sfx('power'); }
    }
    hud();
  }
  if (S.gold && nx === S.gold.p[0] && ny === S.gold.p[1]) {
    S.golds++; S.score += 50; S.gold = null; G.sfx('coin');
    P.burst(nx * C + 16, ny * C + 16, 22, { color: ['#ffd84d', '#ffffff'], speed: 220 });
    P.text(nx * C + 16, ny * C, '+50', { color: '#ffd84d' }); hud();
  }
}
function update(dt) {
  if (!S.started || S.dead) { P.update(dt); return; }
  S.t += dt;
  if (S.gold) { S.gold.t -= dt; if (S.gold.t <= 0) S.gold = null; }
  S.acc += dt;
  while (S.acc >= S.tick && !S.dead) { S.acc -= S.tick; step(); }
  P.update(dt);
}
function render() {
  const ctx = G.ctx, a = G.assets; if (!ctx || !S) return;
  const t = performance.now() / 1000;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) ctx.drawImage((x + y) % 2 ? a.c1 : a.c0, x * C, y * C, C, C);
  if (!S.cfg.wrap) { ctx.strokeStyle = 'rgba(255,90,90,.55)'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, W - 4, H - 4); }
  else { ctx.strokeStyle = `rgba(127,247,255,${.35 + Math.sin(t * 3) * .15})`; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.strokeRect(2, 2, W - 4, H - 4); ctx.setLineDash([]); }
  for (const k of S.rocks) { const [x, y] = k.split(',').map(Number); ctx.drawImage(a.rock, x * C, y * C, C, C); }
  const bob = Math.sin(t * 5) * 2;
  ctx.drawImage(a.apple, S.apple[0] * C, S.apple[1] * C + bob, C, C);
  if (S.gold && (S.gold.t > 2 || Math.floor(t * 8) % 2)) {
    ctx.drawImage(a.gold, S.gold.p[0] * C - 4, S.gold.p[1] * C - 4 + bob, C + 8, C + 8);
  }
  const k = S.started && !S.dead ? Engine.clamp(S.acc / S.tick, 0, 1) : 1;
  const pos = i => {
    const c = S.snake[i], p = S.prev[i] || c;
    if (Math.abs(c[0] - p[0]) > 1 || Math.abs(c[1] - p[1]) > 1) return [c[0], c[1]];
    return [p[0] + (c[0] - p[0]) * k, p[1] + (c[1] - p[1]) * k];
  };
  if (!S.dead || S.eaten >= S.target) {
    const n = S.snake.length;
    for (let i = n - 1; i >= 1; i--) {
      const [x, y] = pos(i), s = C * (1 - i / n * .35);
      ctx.drawImage(a.body, x * C + (C - s) / 2, y * C + (C - s) / 2, s, s);
    }
    const [hx, hy] = pos(0);
    ctx.save(); ctx.translate(hx * C + C / 2, hy * C + C / 2); ctx.rotate(Math.atan2(S.dir[1], S.dir[0]));
    ctx.drawImage(a.head, -C / 2 - 2, -C / 2 - 2, C + 4, C + 4); ctx.restore();
  }
  P.draw(ctx);
  if (!S.started && G.playing) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(W / 2 - 190, H / 2 - 28, 380, 56, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 20px Outfit, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Pulsa una dirección para empezar', W / 2, H / 2); ctx.textBaseline = 'alphabetic';
  }
}
</script>
</body>
</html>
